<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grocery Shop - Buy & Sell Records</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Header -->
  <header class="header">
    <div class="container header-container">
      <div>
        <h1>🛒 FreshMart Grocery Management</h1>
        <p class="subtitle">Buy (Stock Purchases) & Sell (Customer Orders) Tracker</p>
      </div>
      <button class="btn btn-primary" onclick="openAddModal()">+ Add New Transaction (POST)</button>
    </div>
  </header>

  <main class="container">

    <!-- Status / Notification Message -->
    <div id="statusMessage" class="status-message hidden"></div>

    <!-- Filter, Search & Sort Toolbar -->
    <section class="toolbar-card">
      <div class="toolbar-grid">
        
        <!-- Search -->
        <div class="form-group">
          <label for="searchInput">Search Item:</label>
          <input type="text" id="searchInput" placeholder="Type item name..." oninput="handleSearch()">
        </div>

        <!-- Filter by Type (Buy / Sell) -->
        <div class="form-group">
          <label for="typeFilter">Transaction Type:</label>
          <select id="typeFilter" onchange="handleFilterChange()">
            <option value="">All Types (Buy & Sell)</option>
            <option value="Buy">Buy (Purchases)</option>
            <option value="Sell">Sell (Sales)</option>
          </select>
        </div>

        <!-- Filter by Category -->
        <div class="form-group">
          <label for="categoryFilter">Category:</label>
          <select id="categoryFilter" onchange="handleFilterChange()">
            <option value="">All Categories</option>
            <option value="Grains & Staples">Grains & Staples</option>
            <option value="Dairy & Eggs">Dairy & Eggs</option>
            <option value="Fruits & Vegetables">Fruits & Vegetables</option>
            <option value="Beverages">Beverages</option>
            <option value="Oils & Condiments">Oils & Condiments</option>
            <option value="Bakery & Snacks">Bakery & Snacks</option>
            <option value="Meat & Seafood">Meat & Seafood</option>
          </select>
        </div>

        <!-- Sorting -->
        <div class="form-group">
          <label for="sortSelect">Sort By:</label>
          <select id="sortSelect" onchange="handleSortChange()">
            <option value="-id">Newest First (ID Desc)</option>
            <option value="id">Oldest First (ID Asc)</option>
            <option value="-date">Date (Newest to Oldest)</option>
            <option value="date">Date (Oldest to Newest)</option>
            <option value="item">Item Name (A to Z)</option>
            <option value="-item">Item Name (Z to A)</option>
            <option value="totalPrice">Total Price (Low to High)</option>
            <option value="-totalPrice">Total Price (High to Low)</option>
          </select>
        </div>

        <!-- Per Page Limit -->
        <div class="form-group per-page-group">
          <label for="limitSelect">Per Page:</label>
          <select id="limitSelect" onchange="handleLimitChange()">
            <option value="5">5</option>
            <option value="8">8</option>
            <option value="10">10</option>
          </select>
        </div>

      </div>
    </section>

    <!-- Table Section -->
    <section class="table-card">
      <div class="table-header-info">
        <span id="recordCountText">Loading records...</span>
        <button class="btn btn-sm btn-outline" onclick="loadTransactions()">🔄 Refresh (GET)</button>
      </div>

      <div class="table-wrapper">
        <table class="data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Type</th>
              <th>Item Name</th>
              <th>Category</th>
              <th>Qty</th>
              <th>Unit Price</th>
              <th>Total Price</th>
              <th>Customer / Supplier</th>
              <th>Date</th>
              <th>Status</th>
              <th>Actions (HTTP Methods)</th>
            </tr>
          </thead>
          <tbody id="transactionTableBody">
            <!-- Table rows generated by JavaScript -->
          </tbody>
        </table>
      </div>

      <!-- Pagination Section -->
      <div class="pagination-container">
        <button id="prevBtn" class="btn btn-secondary" onclick="goToPrevPage()">◀ Previous</button>
        <div id="pageNumbers" class="page-numbers"></div>
        <button id="nextBtn" class="btn btn-secondary" onclick="goToNextPage()">Next ▶</button>
      </div>
    </section>

  </main>

  <!-- ================= ADD MODAL (POST) ================= -->
  <div id="addModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Add New Transaction <span class="badge-method badge-post">POST</span></h2>
        <button class="btn-close" onclick="closeAddModal()">&times;</button>
      </div>
      <form id="addForm" onsubmit="handleCreateTransaction(event)">
        <div class="form-row">
          <div class="form-group">
            <label for="addType">Type:</label>
            <select id="addType" required>
              <option value="Sell">Sell (Customer Sale)</option>
              <option value="Buy">Buy (Supplier Purchase)</option>
            </select>
          </div>
          <div class="form-group">
            <label for="addCategory">Category:</label>
            <select id="addCategory" required>
              <option value="Grains & Staples">Grains & Staples</option>
              <option value="Dairy & Eggs">Dairy & Eggs</option>
              <option value="Fruits & Vegetables">Fruits & Vegetables</option>
              <option value="Beverages">Beverages</option>
              <option value="Oils & Condiments">Oils & Condiments</option>
              <option value="Bakery & Snacks">Bakery & Snacks</option>
              <option value="Meat & Seafood">Meat & Seafood</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="addItem">Item Name:</label>
          <input type="text" id="addItem" placeholder="e.g. Basmati Rice 5kg" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="addQuantity">Quantity:</label>
            <input type="number" step="any" min="0.01" id="addQuantity" placeholder="e.g. 5" oninput="calculateAddTotal()" required>
          </div>
          <div class="form-group">
            <label for="addUnit">Unit:</label>
            <input type="text" id="addUnit" placeholder="e.g. kg, bag, bottle" required>
          </div>
          <div class="form-group">
            <label for="addUnitPrice">Unit Price ($):</label>
            <input type="number" step="any" min="0" id="addUnitPrice" placeholder="e.g. 10.50" oninput="calculateAddTotal()" required>
          </div>
        </div>

        <div class="form-group">
          <label>Calculated Total Price ($):</label>
          <input type="text" id="addTotalPriceDisplay" readonly value="0.00">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="addParty">Party (Customer / Supplier):</label>
            <input type="text" id="addParty" placeholder="e.g. John Doe or Supplier Name" required>
          </div>
          <div class="form-group">
            <label for="addDate">Date:</label>
            <input type="date" id="addDate" required>
          </div>
        </div>

        <div class="form-group">
          <label for="addStatus">Status:</label>
          <select id="addStatus" required>
            <option value="Completed">Completed</option>
            <option value="Pending">Pending</option>
            <option value="Cancelled">Cancelled</option>
          </select>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeAddModal()">Cancel</button>
          <button type="submit" class="btn btn-success">Save Transaction (POST)</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ================= EDIT MODAL (PUT) ================= -->
  <div id="editModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Edit Transaction <span class="badge-method badge-put">PUT</span></h2>
        <button class="btn-close" onclick="closeEditModal()">&times;</button>
      </div>
      <form id="editForm" onsubmit="handleUpdateTransaction(event)">
        <!-- Hidden input to store ID being edited -->
        <input type="hidden" id="editId">

        <div class="form-row">
          <div class="form-group">
            <label for="editType">Type:</label>
            <select id="editType" required>
              <option value="Sell">Sell (Customer Sale)</option>
              <option value="Buy">Buy (Supplier Purchase)</option>
            </select>
          </div>
          <div class="form-group">
            <label for="editCategory">Category:</label>
            <select id="editCategory" required>
              <option value="Grains & Staples">Grains & Staples</option>
              <option value="Dairy & Eggs">Dairy & Eggs</option>
              <option value="Fruits & Vegetables">Fruits & Vegetables</option>
              <option value="Beverages">Beverages</option>
              <option value="Oils & Condiments">Oils & Condiments</option>
              <option value="Bakery & Snacks">Bakery & Snacks</option>
              <option value="Meat & Seafood">Meat & Seafood</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="editItem">Item Name:</label>
          <input type="text" id="editItem" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="editQuantity">Quantity:</label>
            <input type="number" step="any" min="0.01" id="editQuantity" oninput="calculateEditTotal()" required>
          </div>
          <div class="form-group">
            <label for="editUnit">Unit:</label>
            <input type="text" id="editUnit" required>
          </div>
          <div class="form-group">
            <label for="editUnitPrice">Unit Price ($):</label>
            <input type="number" step="any" min="0" id="editUnitPrice" oninput="calculateEditTotal()" required>
          </div>
        </div>

        <div class="form-group">
          <label>Calculated Total Price ($):</label>
          <input type="text" id="editTotalPriceDisplay" readonly value="0.00">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="editParty">Party (Customer / Supplier):</label>
            <input type="text" id="editParty" required>
          </div>
          <div class="form-group">
            <label for="editDate">Date:</label>
            <input type="date" id="editDate" required>
          </div>
        </div>

        <div class="form-group">
          <label for="editStatus">Status:</label>
          <select id="editStatus" required>
            <option value="Completed">Completed</option>
            <option value="Pending">Pending</option>
            <option value="Cancelled">Cancelled</option>
          </select>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
          <button type="submit" class="btn btn-warning">Full Update (PUT)</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
